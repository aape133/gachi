[package]
name = "gachi-net"
description = "P2P UDP transport: hole punching, audio packets, RTT/loss/jitter stats"
license.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
gachi-proto.workspace = true
gachi-engine.workspace = true
arc-swap.workspace = true
rand.workspace = true
rtrb.workspace = true
tracing.workspace = true
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
socket2 = { version = "0.5", features = ["all"] }
igd-next = "0.16"
netdev = "0.47.0"


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock"] }

[target.'cfg(windows)'.dev-dependencies]
# examples/wifi_stall: ping over Wi-Fi, and the Wi-Fi settings it compares;
# examples/dscp_probe: packets marked the ways Windows offers
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_WiFi", "Win32_System_IO", "Win32_NetworkManagement_QoS", "Win32_Networking_WinSock"] }
